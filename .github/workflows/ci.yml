name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: >-
          python -m py_compile
          mine_commits.py
          mine_gitcode_activity.py
          k3-adaptation/audit_k3_pr_authors.py
      - name: Verify data checksums
        run: shasum -a 256 -c SHA256SUMS
      - name: Run unit and data-consistency tests
        run: python -m unittest discover -s tests -v
